rationale: >-
  results/ov_diag/REPORT.md (2026-10-24, warehouse t1 L0/L1 only, stock OpenVINS, 10 offsets x 4 sequences): the frozen
  MSCKF window is too short in TIME (max_clones 11 cloned at every 20 Hz frame = 0.55 s), while VINS-Fusion uses a 10 Hz
  front-end with a multi-second keyframe window. Cloning every 2nd frame (track_frequency 10.5) with 15 clones (1.5 s)
  gives -29 % ATE vs the frozen config on L0+L1 ([-38, -20], p = 5e-6, 33/7 wins), halves the rotation error, 0 failures,
  and -30 % vs VINS-Fusion; trk10 alone -29 %, clones30 at 20 Hz -26 %. IMU noise, features, init, ZUPT and sigma_px
  variants were all no better. The variant was selected on t1 (tuning set) among ~28 back-end variants: its t1 numbers
  are optimistic. hall L3 divergence is not config-related (ov_diag (b)).
estimator_change:
  track_frequency:
    v1: 21.0
    v2: 10.5
    effect: 'ROS2Visualizer::callback_stereo drops a stereo frame whose stamp < last kept stamp + 1/10.5 s = 95.2 ms -> with
      20 Hz cameras every 2nd frame is processed (10 Hz tracking, cloning and update)'
  max_clones:
    v1: 11
    v2: 15
  unchanged: every other key (max_msckf_in_update 40, max_slam 50, num_pts 150, init_*, noise, ...) and both kalibr files
ov_diag_variant: trk10_clones15 (results/ov_diag/configs/trk10_clones15/estimator_config.yaml md5 129588c7..., same two
  values; only the comment tag differs)
mechanism: >-
  CFG of the run scripts (config:=<abs estimator yaml>). savior.launch.py takes the dataset name from the directory NAME and
  kalibr_imucam_chain.yaml / savior_perception.yaml from the same directory, so each v2 directory holds the v2 estimator
  yaml plus VERBATIM (md5-identical) copies of the other files of the frozen directory. src/savior is not modified.
