    s on the warehouse, P5 late-start offsets on VIODE, mask_policy wait, mask_timeout_ms 30000, ov_set
    deterministic_processing=true dynamic_mask_upstream_compat=true dynamic_mask_max_pending=0, feature_stats auto)
  validity: clean exit, trajectory, FINAL fallback_latest = fallback_empty = late_masks = 0, n_in_core = 0, poses >= same-offset
    openvins (v2) poses - 1; savior_none == openvins (md5) on the warehouse
  note_pose_count: v2 publishes one pose per PROCESSED frame (10 Hz), so pose counts are about half of v1; the pose rule compares
    with the same-offset openvins run of the SAME back-end
