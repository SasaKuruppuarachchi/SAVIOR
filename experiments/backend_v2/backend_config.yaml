viode_rule:
  decision: IDENTICAL RULE (track_frequency 10.5, max_clones 15) - recommended, NOT tuned and NOT run on VIODE
  basis: 'the VIODE v1 config has the same short window (cameras 20.0 Hz per bag metadata, track_frequency 21.0, max_clones
    11 = 0.55 s); the rule is stated in camera-rate terms (clone at ~10 Hz, 15 clones ~ 1.5 s), so it transfers without
    looking at VIODE results'
  author_confirmation: required before the held-out run (held-out script default BACKEND_VIODE=v2; BACKEND_VIODE=v1 keeps the
    frozen VIODE estimator)
protocol:
