status: FROZEN - chi2-realworld protocol, written BEFORE any run (one-shot, no tuning)
frozen_at: 2026-10-28T14:52:07+0200
purpose: 'Run ONCE, untuned, the frozen t1-tuned chi2 x0.25 gate variants (review_runs FREEZE.yaml: ovchi_best, sf1_chibest) on the real-world Monado data,
  paired with the existing rate-0.25 real-world OpenVINS / SAVIOR / Y-Cls / VINS-Fusion runs, and apply the pre-registered DECISION_RULE.txt (T1 and T2).'
