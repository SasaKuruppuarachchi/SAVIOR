methods:
  sf1_nis: 'SAVIOR (frozen sens_fix1 instantiation of each dataset) + NIS-adaptive gate: INSTALL results/semantic_gate/install, ov_set + savior_nis_gate=true
    (code defaults window 200, scale clamp [0.05, 20]); nothing else'
  ov_nis: OpenVINS (frozen openvins instantiation of each dataset) + NIS-adaptive gate, same delta
  ctl_sens_fix1 / ctl_openvins: 'md5-identity control (SG install, NO delta) on warehouse hall_t2_L3 runs 1-5 only (the held-out warehouse is bit-deterministic):
    trajectories must equal the frozen sens_fix1 / openvins runs. Check only, not in statistics.'
  delta_rule: held-out instantiation = the freeze delta (semantic_gate FREEZE.yaml methods.<v>.ovset_add) applied to the frozen instantiation of the base
    method on that dataset; for Monado the key is added to the ov_set ROS-parameter string of the frozen real-world OpenVINS config exactly as the freeze
    applies it (no yaml edit)
  parameter_diff: 'scripts/nv_check.py -> tables/param_diff.md: 185 / 185 settings files: exactly the NIS delta. Errors: 0.'
datasets:
  warehouse_t2:
    sequences:
    - aisles_t2_L0
    - aisles_t2_L1
    - aisles_t2_L2
    - aisles_t2_L3
    - hall_t2_L0
    - hall_t2_L1
    - hall_t2_L2
    - hall_t2_L3
    - dock_t2_L0
    - dock_t2_L1
    - dock_t2_L2
    - dock_t2_L3
    offsets_s: 0.0..1.8 (10)
    rate: 0.5
    backend: v2
    runner: run_nv.sh = review_runs run_rr.sh protocol
    failure_m: 2.0
  viode:
    sequences:
    - parking_lot_none
    - parking_lot_low
    - parking_lot_mid
    - parking_lot_high
    - city_day_none
    - city_day_low
    - city_day_mid
    - city_day_high
    - city_night_none
    - city_night_low
    - city_night_mid
    - city_night_high
    offsets_s: P5 late-start (parking_lot 5.5.., city_day 4.1.., city_night 6.1.., 10 each)
    rate: 0.5
    backend: v2 (BACKEND_VIODE=v2)
    failure_m: 1.0
  openloris:
    sequences:
    - openloris_cafe1-1
    - openloris_cafe1-2
    - openloris_office1-1
    - openloris_office1-2
    - openloris_office1-3
    - openloris_office1-4
    - openloris_office1-5
    - openloris_office1-6
    - openloris_office1-7
    offsets_s: 0.0..1.8 (10)
    rate: 0.5
    config: ORIGINAL estimator config (task E)
    failure_m: 1.0
    note: cafe1-1 = P2 tuning sequence, reported separately
  uhumans2:
    sequences:
    - uhumans2_office_s1_00h
    - uhumans2_office_s1_06h
    - uhumans2_office_s1_12h
    offsets_s: 00h 0.0..0.8 (5); 06h / 12h 0.0..1.8 (10)
    rate: 0.5
    config: ORIGINAL estimator config (task E)
    failure_m: 1.0
  monado:
    sequences:
    - MIO13
    - MIO15
    - MIO16
    - MIO07 (static control)
    offsets_s: 0.0..1.8 (10)
    rate: 0.25
    config: frozen real-world configs (FREEZE.md5 + FREEZE_AMENDMENT.md5, asserted by rw_args.py)
    failure_m: 1.0
  cap_m: 10.0
  runs: results/nis_validation/runs/{t2,viode,e,rw,ctl}/<seq>/<variant>/run_XX (run index = offset index, as the baselines)
pairings:
  warehouse_t2 / viode: openvins, sens_fix1, yolo_naive (results/backend_v2/heldout/runs); ovchi_best, sf1_chibest (results/review_runs/runs/heldout)
  openloris / uhumans2: e_openvins, e_sens_fix1, e_yolo_naive (results/review_runs/runs/e)
  monado: openvins, sens_fix1, yolo_naive, vins_fusion at rate 0.25 (results/real_world/runs; Amendment 2)
  unit: same sequence and same start offset (run_XX index); existing baseline runs are reused, never re-run
validity:
  warehouse_t2 / viode: 'results/review_runs/scripts/rr_audit.py rules (= m2bsync + AUDIT_NOTE 0.101 s end tolerance for back-end v2): run_info ok/0, non-empty
    trajectory, FINAL fallback_latest = fallback_empty = late_masks = 0 (savior launches), n_in_core = 0, last pose >= same-offset openvins(-v2) last pose
    - 0.101 s and <= 1 pose missing after the own first pose; pose rule (>= openvins - 1) reported'
  openloris / uhumans2: the same rr_audit.py rules with the reference e_openvins (review_runs/runs/e)
  monado: 'results/real_world/scripts/rw_analyze.py rules: status ok, trajectory, FINAL (savior launch) fallbacks = late = 0, n_in_core = 0, pose rule poses
    >= same-offset openvins - 1, and the Amendment-2 frame rule: processed stereo frames ("[TIME]: ... seconds total" lines) == prep/expected_frames.yaml
    ros2_pairs for the offset, +-0'
  reruns: an invalid run is re-run unchanged (FORCE), up to 3 attempts in total; any run still invalid is reported, kept in the include-all sensitivity
    and excluded pairwise from the primary statistics (as task E did for its baselines). Baseline runs are audited with the same rule; pairs with an invalid
    baseline run are excluded pairwise in the primary statistics.
statistics:
  metric: ATE RMSE (savior-eval multi, posyaw, full sequence); failures = ATE > failure_m (warehouse 2 m, others 1 m), log ratios capped at 10 m
  run_level: 'paired per-offset log ATE ratio; geometric-mean ratio - 1; iid bootstrap 95 % CI over the pooled pairs (20000, seed 0); Wilcoxon signed-rank
    (zero differences dropped); Holm within each dataset x group over the PRIMARY comparisons (secondary comparisons: own Holm family)'
  sequence_level: 'results/stats_v3/scripts/stats3_core.py (imported): exp(mean of per-sequence mean log ratios) - 1, two-stage cluster bootstrap CI (boot_two_stage,
    20000, seed 0), exact sign-flip p (signflip; min p = 2/2^k reported)'
  rpe: savior-eval RPE, mean translational error at the shortest sub-length; paired log ratio over pairs where both runs are not failures and have RPE segments;
    same run-level statistics (secondary)
  lambda: 'per run, from the [SAVIOR-GATE] msckf / slam log lines (one every 200 update calls): median nis_lambda over the run, and the fraction of lines
    at the lower clamp (<= 0.0500) and at the upper clamp (>= 20.0); reported per dataset (median over runs of the run medians, IQR, mean clamp fractions)'
  sensitivity: include-all (invalid runs kept), failures excluded instead of capped
