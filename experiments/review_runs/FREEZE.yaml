protocol:
  heldout: warehouse t2 (12 seq) + VIODE (12 seq), offsets 0.0-1.8 s (warehouse) / P5 late-start (VIODE), rate 0.5, mask_policy wait, timeout
    30 s, feature_stats auto, back-end v2 (BACKEND_VIODE=v2); identical to results/backend_v2/scripts/run_heldout_v2.sh
  E: OpenLORIS cafe1-1 (tuning) + cafe1-2, office1-1..7 (held-out of P2/P4), offsets 0.0-1.8 s (superset of the P2 offsets 0.0/0.2/0.4); uHumans2
    office_s1 00h (5 offsets 0.0-0.8 s), 06h/12h (10 offsets 0.0-1.8 s) as P3a; rate 0.5; ORIGINAL estimator configs; references re-run with the
    same install (openvins, savior_none, oracle_person on uHumans2)
  validity: 'scripts/rr_audit.py: clean exit, trajectory, FINAL fallbacks = late = 0, n_in_core = 0, end within 0.101 s of the same-offset OpenVINS(-v2)
    run with <= 1 pose missing after the own first pose; pose rule reported; ctl_* md5 controls'
  statistics: 'scripts/rr_analyze.py: bv2analyze.py statistics + two-stage sequence-cluster bootstrap (20000, seed 1); failures > 2 m warehouse
    / > 1 m VIODE, cap 10 m; E: failures > 1 m (none expected), same paired stats'
  comparisons:
    A: sf1_noint, sf1_nomotion vs sens_fix1, yolo_naive, openvins
    B: ovchi_best vs openvins; sens_fix1 / yolo_naive / sf1_chibest vs ovchi_best; sf1_chibest vs sens_fix1
    E: e_sens_fix1 vs e_openvins and vs e_yolo_naive (run- and sequence-level); e_savior_none vs e_openvins (control); e_oracle_person vs e_savior_none
      (uHumans2, P3a reference)
paper_labels:
  sf1_noint: SAVIOR w/o interaction (class prior + motion-consistency check, no association tree)
  sf1_nomotion: SAVIOR w/o motion evidence (class prior + interaction)
  ovchi_best: OpenVINS chi2 x0.25
  sf1_chibest: SAVIOR + OpenVINS chi2 x0.25
