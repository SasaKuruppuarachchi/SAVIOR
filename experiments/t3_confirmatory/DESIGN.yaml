# SAVIOR-Warehouse t3 CONFIRMATORY split: PRE-REGISTERED DESIGN. FROZEN at 2026-10-26T17:50:54+00:00 before any t3
# rendering (only numpy generator checks and dev-seed previews existed). Do not edit: its md5 is in DESIGN.md5
# and src/savior/docs/IMPLEMENTATION_PLAN.md section 6. A change needs a new, dated, disclosed amendment file.
name: SAVIOR-Warehouse t3 confirmatory split
status: FROZEN
frozen_at: '2026-10-26T17:50:54+00:00'
frozen_by: t3 dataset agent (author approval of a new confirmatory split, 2026-10-26)
rationale: 'results/stats_v3/REPORT.md: the held-out split t2 has only 3 independent trajectories (aisles / hall / dock),
  i.e. 6 sequences per level group, too few for confirmatory claims (sign-flip p cannot go below 0.031; between-sequence variance
  share 0.3-0.9). t3 adds new independent trajectories on several Isaac Sim warehouse environments, with the unit of inference
  = trajectory, a fixed hierarchical (gatekeeping) primary family and frozen methods.'
dataset:
  sequence_name: <traj id>_t3_L<level>, e.g. fw01_t3_L3
  generator: src/savior/savior_datasets/warehouse/scenes/procedural.py (GEN_VERSION t3-gen-1); render with isaac/render_sequence.py
    --scene procedural:<traj id>; tools/render_t3.sh (raw + --seg-right bag + GT)
  independent_trajectories: 24
  per_environment: 6
  environments:
    fw:
      usd: Isaac/Environments/Simple_Warehouse/full_warehouse.usd
      used_in_t1_t2: true
      note: the south hall (30 x 29 m, empty in the asset); new seeded lane-grid layouts (t1/t2 used hand-made layouts)
    sw:
      usd: Isaac/Environments/Simple_Warehouse/warehouse.usd
      used_in_t1_t2: false
      note: 20 x 30 m shell with one wall rack row; seeded lane-grid layouts
    ms:
      usd: Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd
      used_in_t1_t2: false
      note: three 17 m rack rows with boxes / KLT bins (labelled rack / box); the two pallet bins deactivated; loop through
        both aisles, pallet rows along the rack faces
    wx:
      usd: Isaac/Environments/warehouse_20x20_envi/warehouse_20x20_envi.usd
      used_in_t1_t2: false
      note: different asset family (white / blue hall, blue wall racks, tables); its central clutter deactivated, seeded layout
        of Simple_Warehouse props
  levels:
  - 0
  - 1
  - 2
  - 3
  nesting: an actor of tier k is present at every level >= k (generated L3 -> L2 -> L1; collision checked jointly)
  choreography:
    L0: static layout only (pallet stacks, KLT pallets, pallet piles, dollies, rails, parked driverless forklifts)
    L1: walking people (standing at stacks in view of the hover, one moving DURING the hover, one starting at take-off, head-on,
      walking ahead, crossing at intersections, one across the final hover)
    L2: + forklifts with seated drivers and loads (crossing at take-off / intersections, two leaders 5.5-8 m ahead with late
      onset that turn off, head-on turning off, overtaking, slow parallel) and people pushing loaded carts
    L3: + co-moving forklift(s) 3-5.5 m ahead (parked ahead during the hover, starts after take-off; a second one turns in
      later; the last stops in front of the final hover), one alongside, raised loads, two loaded carts ahead
  camera: quadrotor differential flatness (wh.trajectory.BodyTrajectory, as t1/t2), random tour on the lane graph, 80-92 m,
    legs 0.70-1.30 m/s, heights 1.0-1.8 m plus one 2.2-2.4 m leg, look-around 12-14 deg, 3 s hover + 0.3 m take-off climb,
    2 s end hover, yaw rate <= 100 deg/s
  duration_s:
    accepted_range:
    - 92.0
    - 112.0
    nominal: ~100
  frame_rate_hz: 20
  imu_rate_hz: 200
  rig: src/savior/savior_datasets/warehouse/configs/rig_zed2i_4mm.yaml (ZED 2i 4 mm, 672x376, fx 470, baseline 0.12 m)
  imu_noise:
    gyroscope_noise_density: 0.000244
    gyroscope_random_walk: 2.0e-05
    accelerometer_noise_density: 0.0016
    accelerometer_random_walk: 0.0003
    gyro_bias_init_sigma: 0.003
    accel_bias_init_sigma: 0.03
    seed: the trajectory seed (identical IMU noise at all levels of a trajectory)
  render: RTX RaytracedLighting, 4 subframes, no motion blur / auto exposure, depth0, seg0 + seg1
  storage: raw + bags on the HDD archive (/home/hdd/sasa/archive/savior/workspace/data/warehouse/t3), symlinked from data/warehouse/raw/<seq>
    and data/warehouse/ros2_stereoseg/<seq>; GT data/warehouse/gt/<seq>.txt
  coverage_targets: approximate t1/t2 levels (moving coverage mean L1 ~1 %, L2 ~4-6 %, L3 ~15-25 %), calibrated ONLY on generator
    development seeds (dev-<site>-90xx; never t3 seeds); t3 seeds are rendered as generated
  coverage_calibration_dev_seeds: 'final generator, low-res previews (every 5th frame, 0.25 scale) of dev-fw-9001/9011, dev-sw-9002,
    dev-ms-9013, dev-wx-9004: moving coverage mean L1 0.3-1.2 % (mean ~0.7), L2 2.2-4.6 % (mean ~2.6), L3 16-23 % (mean ~20).
    KNOWN DEVIATION (disclosed before freezing): L1 and especially L2 are below t1/t2 (L1 ~1.2 %, L2 ~5.6 %) in the three
    smaller environments, where the joint collision check leaves less room; L3 matches (t1/t2 ~19-21 %). The levels stay ordered
    L0 < L1 < L2 < L3. The high-dyn group L2+L3 is dominated by L3 as in t1/t2.'
  pre_render_seed_rule: 'a frozen seed is replaced by the next spare seed of its site (seed formula 31000 + 1000 i_site +
    101 k, spares k = 7..12) only if the numpy generator fails for it or its choreography is structurally incomplete (no L3
    co-mover, < 3 moving L2 vehicles or < 6 moving L1 people). Applied by make_design.py before freezing; no rendering, no
    VIO. After freezing: --plan clearance report per trajectory; a camera clearance < 0.25 m is reported, not tuned.'
