exclusion_rule:
  written: before any t3 rendering or sanity run; applied mechanically by results/t3_confirmatory/scripts/t3_checks.py
  unit: trajectory (all four levels are excluded together, to keep the nested design balanced)
  R1_data_integrity: 'exclude a trajectory if, after at most one deterministic re-render of the same frozen specification,
    any of its sequences has: no render / no bag / no GT; cam0, cam1 or frames.csv counts that differ from meta.json; imu_noisy.csv
    md5 that differs across its levels; IMU check (tools/check_imu.py on L0) gyro_clean vs GT RMS > 1e-4 rad/s, acc_clean
    vs GT RMS > 1e-4 m/s^2, 10 s dead-reckoning position error > 5 mm, or estimated white-noise density off by > 5 %; geometry
    check (tools/check_geometry.py on L3) best stereo scale != 1.00, best disparity offset != 0 px, or the true pose not best
    in the temporal test.'
  R2_initialisation: 'sanity runs (OpenVINS back-end v2 and oracle_moving_ext only, offsets 0.0 / 0.3 / 0.6 s, on L0 and L3):
    exclude a trajectory if OpenVINS at L0 fails (no estimate, status != ok, or posyaw ATE > 2 m) on >= 2 of the 3 offsets.
    L0 has no movers, so an L0 failure means the trajectory itself (motion / texture / initialisation) is broken; L3 failures
    are treatment effects and NEVER exclude (the L3 sanity results are reported only).'
  tolerances:
    gyro_vs_gt_rms_max: 0.0001
    acc_vs_gt_rms_max: 0.0001
    dr_pos_err_max_m: 0.005
    noise_density_rel_tol: 0.05
    sanity_L0_min_failed_offsets: 2
  replacement: excluded trajectories are NOT replaced; the analysis uses the remaining ones and reports the exclusions
analysis_plan:
  unit: trajectory
  model: 'paired log ATE ratio per run, log(min(ATE_A, cap) / min(ATE_B, cap)), same start offset; mean over the offsets of
    a sequence; REML random-intercept model per trajectory over its sequences (the stats_v3 code, stats3_core.reml_ri), t
    test on the intercept with df = n_trajectories - 1; estimate exp(mu) - 1 with 95 % t interval. Sensitivity: one-stage
    trajectory bootstrap, exact sign-flip test on the trajectory means, caps 2 / 5 / 50 m and failures excluded.'
  metric: ATE posyaw RMSE (savior-eval multi, full sequence), failure = ATE > 2 m or status != ok (counted as inf)
  failure_threshold_m: 2.0
  cap_m: 10.0
  cap_sensitivity_m:
  - 2.0
  - 5.0
  - 50.0
  - excl
  groups:
    static:
    - L0
    low:
    - L0
    - L1
    high:
    - L2
    - L3
  offsets_s:
  - 0.0
  - 0.4
  - 0.8
  - 1.2
  - 1.6
  offsets_justification: 'start offsets are within-sequence repeats; with the trajectory as the unit their variance enters
    a trajectory mean as sigma2 / (m k), which the t2 fits show is small against the between-sequence variance (results/t3_confirmatory/
    tables/power.json: V_B 0.609 with 5 offsets vs 0.540 with 10 for P2), so 5 offsets keep > 90 % of the information at half
    the runs; the budget goes into 24 independent trajectories instead.'
  rate: 0.5
  equivalence_margin_pct:
  - -10.0
  - 10.0
  primary:
  - id: P1
    type: superiority
    a: oracle_moving_ext
    b: oracle_class_ext
    group: high
    text: O-Dyn+B beats O-Cls+B at high-dyn (L2+L3), OpenVINS-v2
  - id: P2
    type: superiority
    a: sens_fix1
    b: yolo_naive
    group: high
    text: SAVIOR beats Y-Cls at high-dyn, OpenVINS-v2
  - id: P3
    type: superiority
    a: sens_fix1
    b: yolo_naive
    group: low
    text: SAVIOR beats Y-Cls at low-dyn (L0+L1), OpenVINS-v2
  - id: P4
    type: superiority
    a: sens_fix1
    b: openvins
    group: high
    text: SAVIOR beats OpenVINS at high-dyn, OpenVINS-v2
  - id: P5
    type: equivalence
    a: sens_fix1
    b: openvins
    group: static
    text: 'SAVIOR has no static cost vs OpenVINS at L0: 90 % CI of the ATE ratio inside [0.90, 1.10]'
  error_control: 'fixed-sequence (hierarchical gatekeeping) P1 -> P2 -> P3 -> P4 -> P5, each at two-sided alpha 0.05 (P5:
    TOST at 0.05); a hypothesis is tested only if all earlier ones were rejected in the stated direction; the first non-rejection
    stops the confirmatory family (later ones are reported as exploratory). Controls the family-wise error rate at 0.05.'
  secondary:
    error_control: Holm over this family (cap 10 m); exploratory
    comparisons:
    - id: S1
      a: vins_savior
      b: vins_ycls
      group: high
    - id: S2
      a: vins_savior
      b: vins_ycls
      group: low
    - id: S3
      a: vins_savior
      b: vins_fusion
      group: high
    - id: S4
      a: vins_odyn
      b: vins_ocls
      group: high
    - id: S5
      a: vins_ycls
      b: vins_fusion
      group: static
    - id: S6
      a: vins_savior
      b: vins_fusion
      group: static
    - id: S7
      a: sens_fix1
      b: dynavins
      group: high
    - id: S8
      a: sens_fix1
      b: dynavins
      group: low
    - id: S9
      a: savior_edge
      b: sens_fix1
      group: high
    - id: S10
      a: savior_edge
      b: sens_fix1
      group: low
    - id: S11
      a: yolo_naive
      b: openvins
      group: static
    - id: S12
      a: oracle_moving_ext
      b: openvins
      group: high
    - id: S13
      a: sens_fix1
      b: openvins
      group: low
    - id: S14
      a: dynavins
      b: vins_fusion
      group: high
    other: 'failure rates per method x group (trajectory-cluster bootstrap CIs, paired sign-flip on trajectory failure differences);
      non-failed accuracy (cap ''excl''); per-environment breakdown (fw / sw / ms / wx: the new environments are an honest
      generalisation test of the frozen segmenter); controls savior_none == openvins and vins_zero == vins_fusion reported.'
  methods:
    openvins_v2_family:
      runner: results/t3_confirmatory/scripts/run_t3_ov2.sh (results/backend_v2/scripts/run_heldout_v2.sh pattern; settings
        from the unchanged frozen resolver bv2_args.py, back-end v2)
      list:
      - openvins
      - savior_none
      - yolo_naive
      - sens_fix1
