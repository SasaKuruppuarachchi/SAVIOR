name: SAVIOR-Warehouse t3 confirmatory split
status: FROZEN
frozen_at: null
frozen_by: t3 dataset agent (author approval of a new confirmatory split, 2026-10-26)
rationale: >-
  results/stats_v3/REPORT.md: the held-out split t2 has only 3 independent trajectories (aisles / hall / dock), i.e. 6
  sequences per level group, too few for confirmatory claims (sign-flip p cannot go below 0.031; between-sequence variance
  share 0.3-0.9). t3 adds new independent trajectories on several Isaac Sim warehouse environments, with the unit of
  inference = trajectory, a fixed hierarchical (gatekeeping) primary family and frozen methods.
dataset:
  sequence_name: <traj id>_t3_L<level>, e.g. fw01_t3_L3
  generator: src/savior/savior_datasets/warehouse/scenes/procedural.py (GEN_VERSION t3-gen-1); render with
    isaac/render_sequence.py --scene procedural:<traj id>; tools/render_t3.sh (raw + --seg-right bag + GT)
  independent_trajectories: 24
  per_environment: 6
  environments:
    fw:
      usd: Isaac/Environments/Simple_Warehouse/full_warehouse.usd
      used_in_t1_t2: true
      note: the south hall (30 x 29 m, empty in the asset); new seeded lane-grid layouts (t1/t2 used hand-made layouts)
    sw:
      usd: Isaac/Environments/Simple_Warehouse/warehouse.usd
      used_in_t1_t2: false
      note: 20 x 30 m shell with one wall rack row; seeded lane-grid layouts
    ms:
      usd: Isaac/Environments/Simple_Warehouse/warehouse_multiple_shelves.usd
      used_in_t1_t2: false
      note: three 17 m rack rows with boxes / KLT bins (labelled rack / box); the two pallet bins deactivated; loop through
        both aisles, pallet rows along the rack faces
    wx:
      usd: Isaac/Environments/warehouse_20x20_envi/warehouse_20x20_envi.usd
      used_in_t1_t2: false
      note: different asset family (white / blue hall, blue wall racks, tables); its central clutter deactivated, seeded
        layout of Simple_Warehouse props
  levels: [0, 1, 2, 3]
  nesting: an actor of tier k is present at every level >= k (generated L3 -> L2 -> L1; collision checked jointly)
  choreography:
    L0: static layout only (pallet stacks, KLT pallets, pallet piles, dollies, rails, parked driverless forklifts)
    L1: walking people (standing at stacks in view of the hover, one moving DURING the hover, one starting at take-off,
      head-on, walking ahead, crossing at intersections, one across the final hover)
    L2: + forklifts with seated drivers and loads (crossing at take-off / intersections, two leaders 5.5-8 m ahead with
      late onset that turn off, head-on turning off, overtaking, slow parallel) and people pushing loaded carts
    L3: + co-moving forklift(s) 3-5.5 m ahead (parked ahead during the hover, starts after take-off; a second one turns in
      later; the last stops in front of the final hover), one alongside, raised loads, two loaded carts ahead
  camera: quadrotor differential flatness (wh.trajectory.BodyTrajectory, as t1/t2), random tour on the lane graph,
    80-92 m, legs 0.70-1.30 m/s, heights 1.0-1.8 m plus one 2.2-2.4 m leg, look-around 12-14 deg, 3 s hover + 0.3 m
    take-off climb, 2 s end hover, yaw rate <= 100 deg/s
  duration_s: {accepted_range: [92.0, 112.0], nominal: ~100}
  frame_rate_hz: 20
  imu_rate_hz: 200
  rig: src/savior/savior_datasets/warehouse/configs/rig_zed2i_4mm.yaml (ZED 2i 4 mm, 672x376, fx 470, baseline 0.12 m)
  imu_noise: {gyroscope_noise_density: 2.44e-4, gyroscope_random_walk: 2.0e-5, accelerometer_noise_density: 1.6e-3,
    accelerometer_random_walk: 3.0e-4, gyro_bias_init_sigma: 3.0e-3, accel_bias_init_sigma: 3.0e-2,
    seed: the trajectory seed (identical IMU noise at all levels of a trajectory)}
  render: RTX RaytracedLighting, 4 subframes, no motion blur / auto exposure, depth0, seg0 + seg1
  storage: raw + bags on the HDD archive (/home/hdd/sasa/archive/savior/workspace/data/warehouse/t3), symlinked from
    data/warehouse/raw/<seq> and data/warehouse/ros2_stereoseg/<seq>; GT data/warehouse/gt/<seq>.txt
  coverage_targets: approximate t1/t2 levels (moving coverage mean L1 ~1 %, L2 ~4-6 %, L3 ~15-25 %), calibrated ONLY
    on generator development seeds (dev-<site>-90xx; never t3 seeds); t3 seeds are rendered as generated
  coverage_calibration_dev_seeds: >-
    final generator, low-res previews (every 5th frame, 0.25 scale) of dev-fw-9001/9011, dev-sw-9002, dev-ms-9013,
    dev-wx-9004: moving coverage mean L1 0.3-1.2 % (mean ~0.7), L2 2.2-4.6 % (mean ~2.6), L3 16-23 % (mean ~20).
    KNOWN DEVIATION (disclosed before freezing): L1 and especially L2 are below t1/t2 (L1 ~1.2 %, L2 ~5.6 %) in the three
    smaller environments, where the joint collision check leaves less room; L3 matches (t1/t2 ~19-21 %). The levels
    stay ordered L0 < L1 < L2 < L3. The high-dyn group L2+L3 is dominated by L3 as in t1/t2.
  pre_render_seed_rule: >-
    a frozen seed is replaced by the next spare seed of its site (seed formula 31000 + 1000 i_site + 101 k, spares
    k = 7..12) only if the numpy generator fails for it or its choreography is structurally incomplete (no L3 co-mover,
    < 3 moving L2 vehicles or < 6 moving L1 people). Applied by make_design.py before freezing; no rendering, no VIO.
    After freezing: --plan clearance report per trajectory; a camera clearance < 0.25 m is reported, not tuned.
exclusion_rule:
  written: before any t3 rendering or sanity run; applied mechanically by results/t3_confirmatory/scripts/t3_checks.py
  unit: trajectory (all four levels are excluded together, to keep the nested design balanced)
  R1_data_integrity: >-
    exclude a trajectory if, after at most one deterministic re-render of the same frozen specification, any of its
    sequences has: no render / no bag / no GT; cam0, cam1 or frames.csv counts that differ from meta.json; imu_noisy.csv
    md5 that differs across its levels; IMU check (tools/check_imu.py on L0) gyro_clean vs GT RMS > 1e-4 rad/s, acc_clean
    vs GT RMS > 1e-4 m/s^2, 10 s dead-reckoning position error > 5 mm, or estimated white-noise density off by > 5 %;
    geometry check (tools/check_geometry.py on L3) best stereo scale != 1.00, best disparity offset != 0 px, or the true
    pose not best in the temporal test.
  R2_initialisation: >-
    sanity runs (OpenVINS back-end v2 and oracle_moving_ext only, offsets 0.0 / 0.3 / 0.6 s, on L0 and L3): exclude a
    trajectory if OpenVINS at L0 fails (no estimate, status != ok, or posyaw ATE > 2 m) on >= 2 of the 3 offsets.
    L0 has no movers, so an L0 failure means the trajectory itself (motion / texture / initialisation) is broken; L3
    failures are treatment effects and NEVER exclude (the L3 sanity results are reported only).
  tolerances: {gyro_vs_gt_rms_max: 1.0e-4, acc_vs_gt_rms_max: 1.0e-4, dr_pos_err_max_m: 5.0e-3,
    noise_density_rel_tol: 0.05, sanity_L0_min_failed_offsets: 2}
  replacement: excluded trajectories are NOT replaced; the analysis uses the remaining ones and reports the exclusions
analysis_plan:
  unit: trajectory
  model: >-
    paired log ATE ratio per run, log(min(ATE_A, cap) / min(ATE_B, cap)), same start offset; mean over the offsets of a
    sequence; REML random-intercept model per trajectory over its sequences (the stats_v3 code, stats3_core.reml_ri),
    t test on the intercept with df = n_trajectories - 1; estimate exp(mu) - 1 with 95 % t interval. Sensitivity:
    one-stage trajectory bootstrap, exact sign-flip test on the trajectory means, caps 2 / 5 / 50 m and failures excluded.
  metric: ATE posyaw RMSE (savior-eval multi, full sequence), failure = ATE > 2 m or status != ok (counted as inf)
  failure_threshold_m: 2.0
  cap_m: 10.0
  cap_sensitivity_m: [2.0, 5.0, 50.0, excl]
  groups: {static: [L0], low: [L0, L1], high: [L2, L3]}
  offsets_s: [0.0, 0.4, 0.8, 1.2, 1.6]
  offsets_justification: >-
    start offsets are within-sequence repeats; with the trajectory as the unit their variance enters a trajectory mean
    as sigma2 / (m k), which the t2 fits show is small against the between-sequence variance (results/t3_confirmatory/
    tables/power.json: V_B 0.609 with 5 offsets vs 0.540 with 10 for P2), so 5 offsets keep > 90 % of the information
    at half the runs; the budget goes into 24 independent trajectories instead.
  rate: 0.5
  equivalence_margin_pct: [-10.0, 10.0]
  primary:
  - {id: P1, type: superiority, a: oracle_moving_ext, b: oracle_class_ext, group: high,
     text: 'O-Dyn+B beats O-Cls+B at high-dyn (L2+L3), OpenVINS-v2'}
  - {id: P2, type: superiority, a: sens_fix1, b: yolo_naive, group: high, text: 'SAVIOR beats Y-Cls at high-dyn, OpenVINS-v2'}
  - {id: P3, type: superiority, a: sens_fix1, b: yolo_naive, group: low, text: 'SAVIOR beats Y-Cls at low-dyn (L0+L1), OpenVINS-v2'}
  - {id: P4, type: superiority, a: sens_fix1, b: openvins, group: high, text: 'SAVIOR beats OpenVINS at high-dyn, OpenVINS-v2'}
  - {id: P5, type: equivalence, a: sens_fix1, b: openvins, group: static,
     text: 'SAVIOR has no static cost vs OpenVINS at L0: 90 % CI of the ATE ratio inside [0.90, 1.10]'}
  error_control: >-
    fixed-sequence (hierarchical gatekeeping) P1 -> P2 -> P3 -> P4 -> P5, each at two-sided alpha 0.05 (P5: TOST at 0.05);
    a hypothesis is tested only if all earlier ones were rejected in the stated direction; the first non-rejection stops
    the confirmatory family (later ones are reported as exploratory). Controls the family-wise error rate at 0.05.
  secondary:
    error_control: Holm over this family (cap 10 m); exploratory
    comparisons:
    - {id: S1, a: vins_savior, b: vins_ycls, group: high}
    - {id: S2, a: vins_savior, b: vins_ycls, group: low}
    - {id: S3, a: vins_savior, b: vins_fusion, group: high}
    - {id: S4, a: vins_odyn, b: vins_ocls, group: high}
    - {id: S5, a: vins_ycls, b: vins_fusion, group: static}
    - {id: S6, a: vins_savior, b: vins_fusion, group: static}
    - {id: S7, a: sens_fix1, b: dynavins, group: high}
    - {id: S8, a: sens_fix1, b: dynavins, group: low}
    - {id: S9, a: savior_edge, b: sens_fix1, group: high}
    - {id: S10, a: savior_edge, b: sens_fix1, group: low}
    - {id: S11, a: yolo_naive, b: openvins, group: static}
    - {id: S12, a: oracle_moving_ext, b: openvins, group: high}
    - {id: S13, a: sens_fix1, b: openvins, group: low}
    - {id: S14, a: dynavins, b: vins_fusion, group: high}
    other: >-
      failure rates per method x group (trajectory-cluster bootstrap CIs, paired sign-flip on trajectory failure
      differences); non-failed accuracy (cap 'excl'); per-environment breakdown (fw / sw / ms / wx: the new environments
      are an honest generalisation test of the frozen segmenter); controls savior_none == openvins and vins_zero ==
      vins_fusion reported.
  methods:
    openvins_v2_family:
      runner: results/t3_confirmatory/scripts/run_t3_ov2.sh (results/backend_v2/scripts/run_heldout_v2.sh pattern; settings
        from the unchanged frozen resolver bv2_args.py, back-end v2)
      list: [openvins, savior_none, yolo_naive, sens_fix1, oracle_moving_ext, oracle_class_ext, savior_edge]
    vins_fusion_family:
      runner: run_t3.sh step vins (frozen src/savior/sota run_method.sh + export_masks.py via export_masks_t3.py; the
        results/vins_savior/scripts/heldout protocol; rate 0.5, deterministic, P9 gate)
      list: [vins_fusion, vins_zero, vins_savior, vins_ycls, vins_odyn, vins_ocls]
    dynavins: {list: [dynavins], note: upstream DynaVINS (savior-sota:noetic), same offsets; DynaVINS+masks
      (results/dynavins_masks) was not finished / frozen at design time and is NOT part of this plan}
  power:
    method: results/t3_confirmatory/scripts/power_t3.py (t2 variance components from results/stats_v3/tables/stats3_all.json)
    decision: >-
      24 trajectories (6 per environment): power >= 0.8 for P1-P4 at the t2 effect sizes under the nested variance
      model A (P4 0.82, the weakest), and P(passing P1..P4 in sequence) 0.79; 12 trajectories would give 0.49 (P4) and
      0.34. P5 is powered (0.92) only if the true static ratio is ~1.00; at the t2 estimate (+8 %) it is expected to fail.
no_tuning:
  rule: >-
    nothing is tuned, selected or debugged on t3: the frozen warehouse YOLO26 engine (models/warehouse/
    yolo26s-seg-warehouse.engine), results/p7/final_config.yaml + addendum, back-end v2 (results/backend_v2/
    backend_config.yaml), the VINS freeze (results/vins_savior/FREEZE.md5) are used as they are. The segmenter is NOT
    retrained on the new environments (generalisation test).
  allowed_before_freeze: generator development on dev seeds (dev-<site>-900x), numpy plan checks, low-res coverage
    previews of dev seeds
