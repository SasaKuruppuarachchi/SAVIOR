# SAVIOR-Warehouse ground-truth colours (/cam0/segmentation, rgb8) -> class name. Generated by
# savior_datasets/warehouse/tools/export_bringup_configs.py from wh/classes.py (exact colours, no blending:
# the image is rendered from the uint16 instance-id GT with a lookup table -> tolerance 0).
# Format: savior_perception OracleColormapSegmenter (segmenter.backend: oracle_colormap).
# One colour per CLASS (instance ids are in the raw seg0/ pngs and on /cam0/instance_id); touching instances of
# one class merge into one component, as with uHumans2.
encoding: rgb
tolerance: 0
min_area_px: 30
connectivity: 8
instance_mode: components
classes:
  rack:               [[230, 120, 20]]   # role static
  guard_rail:         [[250, 230, 0]]   # role static
  window:             [[90, 200, 255]]   # role static
  forklift:           [[255, 40, 40]]   # role potential
  box:                [[160, 100, 50]]   # role potential
  pallet:             [[60, 180, 75]]   # role potential
  trolley:            [[180, 60, 220]]   # role potential
  person:             [[35, 213, 234]]   # role dynamic
label_ids: {rack: 1, guard_rail: 2, window: 3, forklift: 4, box: 5, pallet: 6, trolley: 7, person: 8}
