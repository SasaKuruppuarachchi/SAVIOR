# SAVIOR-Warehouse ground-truth colours (/cam0/segmentation_moving, rgb8) -> class name. Generated by
# savior_datasets/warehouse/tools/export_bringup_configs.py from wh/classes.py (exact colours, no blending:
# the image is rendered from the uint16 instance-id GT with a lookup table -> tolerance 0).
# Format: savior_perception OracleColormapSegmenter (segmenter.backend: oracle_colormap).
# One colour per CLASS (instance ids are in the raw seg0/ pngs and on /cam0/instance_id); touching instances of
# one class merge into one component, as with uHumans2.
# MOVING variant: only instances whose true speed is > 0.05 m/s in that frame are coloured; class names are
# prefixed with "moving_" so that roles/warehouse_oracle_moving.yaml can make all of them dynamic (oracle
# "perfect motion masks" upper bound). Static people / parked forklifts are background here.
encoding: rgb
tolerance: 0
min_area_px: 30
connectivity: 8
instance_mode: components
classes:
  moving_rack:        [[230, 120, 20]]   # role static
  moving_guard_rail:  [[250, 230, 0]]   # role static
  moving_window:      [[90, 200, 255]]   # role static
  moving_forklift:    [[255, 40, 40]]   # role potential
  moving_box:         [[160, 100, 50]]   # role potential
  moving_pallet:      [[60, 180, 75]]   # role potential
  moving_trolley:     [[180, 60, 220]]   # role potential
  moving_person:      [[35, 213, 234]]   # role dynamic
label_ids: {moving_rack: 1, moving_guard_rail: 2, moving_window: 3, moving_forklift: 4, moving_box: 5, moving_pallet: 6, moving_trolley: 7, moving_person: 8}
