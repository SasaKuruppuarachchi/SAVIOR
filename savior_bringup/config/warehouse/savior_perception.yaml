# savior_node overrides for SAVIOR-Warehouse (Isaac Sim). Loaded AFTER savior_perception/config/default.yaml
# by savior.launch.py; calib_file / roles_file / colormap_file are set by the launch (absolute share paths).
# Generated by savior_datasets/warehouse/tools/export_bringup_configs.py.
savior_node:
  ros__parameters:
    left_topic: /cam0/image_raw
    right_topic: /cam1/image_raw
    cam_left: cam0
    cam_right: cam1
    # oracle: GT class-colour image (rgb8, same stamp as the stereo pair); /cam0/segmentation_moving +
    # oracle/warehouse_colormap_moving.yaml + roles/warehouse_oracle_moving.yaml = perfect moving-object masks
    seg_topic: /cam0/segmentation
    segmenter:
      backend: oracle_colormap
    depth:
      downsample: 2                  # b = 0.12 m, f = 470.0 px
