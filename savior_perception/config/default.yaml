# savior_node default parameters. Every key here equals the built-in default
# (test/test_config.py keeps this file, savior_perception/params.py and core/config.py in sync).
# Usage: ros2 run savior_perception savior_node --ros-args --params-file <this file> -p ...
savior_node:
  ros__parameters:
    # ---------------------------------------------------------------- I/O
    left_topic: /cam0/image_raw
    right_topic: /cam1/image_raw
    seg_topic: ""                  # oracle backends only: colour-coded GT semantic image, exact-time synced
    seg_right_topic: ""            # P5: oracle only: GT semantic image of the RIGHT camera -> right mask = its dynamic-role
                                   # instances (255), replaces the stereo warp ("" = warp). Only exact for dynamic-only
                                   # role tables without extension (no promotion / band on the right side)
    mask_left_topic: /savior/mask/left     # contract §3.1 (mono8, raw size, stamp == left image stamp)
    mask_right_topic: /savior/mask/right
    debug_topic: /savior/debug/overlay
    stats_topic: /savior/stats     # std_msgs/String JSON: stamp, per-stage ms, counts, interaction tree
    publish_debug: false
    sync_queue_size: 30            # exact-time synchronizer queue (bag replay bursts)
    frame_id_left: ""              # "" = copy the image frame_id
    frame_id_right: ""
    stats_compact: false           # P7: stats without the per-instance list / links (savior_stats.jsonl ~25x smaller)
    num_threads: 4                 # P4: OpenCV/torch thread cap (<= 0: all cores); BLAS/OMP via env SAVIOR_NUM_THREADS (default 4)
    # ---------------------------------------------------------------- IMU (P4 motion evidence only)
    imu_topic: ""                  # sensor_msgs/Imu; subscribed only when motion.enable (gyro, IMU frame of calib_file)
    imu_wait_ms: 300               # a frame waits (wall time) for gyro samples covering its stamp -> deterministic replay
    imu_queue_size: 2000
    # ---------------------------------------------------------------- calibration
    calib_file: ""                 # the SAME kalibr_imucam_chain.yaml OpenVINS uses ("" = no stereo)
    cam_left: cam0
    cam_right: cam1
    roles_file: ""                 # "" = share/savior_perception/config/roles_default.yaml
    # ---------------------------------------------------------------- segmenter
    segmenter:
      backend: none                # yolo | oracle_uhumans2 | oracle_colormap | none
      model: ""                    # YOLO26-seg .pt or TensorRT .engine
      conf: 0.25                   # ultralytics default; recall matters more than precision (gating filters)
      iou: 0.7                     # NMS IoU (ultralytics default)
      imgsz: 640
      device: ""                   # "" = ultralytics default
      half: false                  # FP16 for .pt models (engines carry their own precision)
      retina_masks: true           # masks at native resolution (OpenVINS masks raw pixels)
      filter_classes: true         # run only dynamic + potential classes from the role table
      colormap_file: ""            # oracle: colour -> class yaml
      warmup: true
      fast_masks: false            # P7: copy only each detection's box crop of the native-resolution masks GPU -> CPU
                                   # (bit-identical masks; YOLO post-processing p99 24 -> 8 ms with ~70-250 instances)
    # ---------------------------------------------------------------- ROI stereo depth
    depth:
      enable: true
      downsample: 2                # SGBM on 2x-decimated rectified ROI crops: ~8x cheaper; disparity
                                   # stays in full-res px. Short-baseline fisheye (T265, b=6.4 cm): consider
                                   # downsample 1 + rect_focal_scale 0.7 (synthetic: ~9 ms, 2.4% vs 5% median depth error).
      min_depth_m: 0.4             # nearest resolvable depth -> numDisparities = f*b/min_depth (/downsample)
      max_disparity_px: 256
      matcher: sgbm_3way           # sgbm_3way (fast, multi-threaded) | sgbm | bm
      block_size: 5
      uniqueness_ratio: 10
      speckle_window: 50
      speckle_range: 2
      sigma_d_px: 1.0              # instance-level disparity std (full-res px): sigma_z = z^2*sigma_d/(f*b)
      min_valid_px: 20             # fewer valid pixels -> depth unknown
      mask_erode_px: 2             # ignore mask boundary (SGBM edge fattening / segmentation bleed)
      roi_pad_px: 4
      rect_focal_scale: 1.0        # rectified focal = scale * mean raw focal (<1 keeps more fisheye FOV)
      rect_size_scale: 0.0         # rectified size = scale * raw size; <= 0 = auto: cover every valid raw
                                   # pixel (no FOV lost at distorted corners); matching is ROI-only anyway
      rect_max_scale: 2.0          # auto: cap (x raw size) for fisheye lenses a pinhole cannot represent
    # ---------------------------------------------------------------- promotion (classification)
    gating:
      enable: true                 # false = ablation "cdo_off": every potential object is masked
      mode: adaptive               # adaptive: |dz| < half_ext(p)+half_ext(q) + k*sqrt(sz_p^2+sz_q^2)
                                   # fixed:    |dz| < fixed_threshold_m (paper dist_int)
      k_sigma: 3.0
      default_half_extent_m: 0.35  # ~half body thickness; per-class overrides in the roles yaml
      fixed_threshold_m: 2.0
      max_threshold_m: 0.0         # adaptive: cap of the link threshold [m], <= 0 = no cap. sigma_z ~ z^2 makes the
                                   # adaptive threshold explode at range for short baselines (T265 f*b = 12.8 px m:
                                   # 10 m at z = 6.4 m), i.e. links on 2D contact alone, also through occlusions
      dilate_px: 4                 # contact tolerance (two masks within ~2*dilate_px px count as touching)
      min_overlap_px: 5
      unknown_depth_policy: overlap  # overlap: link on 2D contact alone when a depth is unknown | reject
      # P4 short-baseline gate (defaults = P2)
      max_noise_m: 0.0             # cap of the k_sigma*sigma noise term alone [m] (<= 0: no cap)
      link_depth: median           # median: instance medians | contact: depths along the shared boundary
                                   # (ring 3..3+contact_px px from the other mask; occlusion contacts = depth jump)
      contact_px: 6
      contact_min_px: 15           # min valid disparity px per side, else contact_fallback
      contact_margin_m: 0.30       # contact: |dz_c| < margin + min(k_sigma*sigma_c, max_noise_m)
      contact_fallback: median     # median (P2 test) | reject
      promote_contact: true        # P6 ablation: false = no promotion through contact (only roots are dynamic:
                                   # always-dynamic + motion-evidence moving potential objects)
      max_depth: 0                 # P6: max promotion hops from a root (person -> forklift -> box = 2); <= 0 = unlimited
    # ---------------------------------------------------------------- tracking
    tracker:
      enable: true
      min_hits: 2                  # a one-frame false positive is never carried
      max_lost: 5                  # paper K: carry a lost dynamic mask up to 5 frames (250 ms @20 Hz)
      hysteresis_frames: 5         # paper T: a promoted chain survives a 5-frame root occlusion
      iou_type: bbox               # bbox | mask (IoU against the constant-velocity prediction)
      iou_min: 0.3
      class_agnostic: false
      velocity_alpha: 0.5
      carry_promoted: true         # carry promoted potential tracks within their hysteresis window
      motion_model: pixel_cv       # pixel_cv (P2) | ego: IMU-rotation + estimated translation compensated (needs motion.enable)
    # ---------------------------------------------------------------- extension (layer 192)
    extension:
      enable: true
      dilate: true
      margin_m: 0.10               # metric margin -> f*margin/z px
      min_px: 8                    # >= KLT patch radius (OpenVINS 15x15 window)
      max_px: 40
      grow: true
      band_mode: adaptive          # adaptive: band_m + k_sigma*sigma_z(z) | fixed: fixed_band_m (paper dist_ext)
      band_m: 0.25
      k_sigma: 2.0
      fixed_band_m: 0.5
      bbox_expand: 0.10
    # ---------------------------------------------------------------- motion evidence (P4, core/motion.py)
    motion:
      enable: false                # true: gyro-rotation + stereo-translation compensated KLT flow per instance
      image_scale: 0.5             # KLT image decimation
      klt_win: 11                  # [px at image_scale]
      klt_levels: 2
      fb_max_px: 0.6               # forward-backward check [full-res px]
      bg_points: 150               # background points (ego translation from their stereo depth)
      bg_min_inliers: 15           # fewer -> translation unknown (coherent noise max_ego_speed*dt)
      bg_exclude_px: 10
      inst_points: 25
      inst_erode_px: 6             # points stay this far inside the mask (KLT patches straddling the boundary are biased)
      per_point_depth: false       # true: per-point KLT stereo depth; false: one robust (median) depth per instance
      min_points: 6
      redetect_ratio: 0.6          # re-detect instance points below ratio * inst_points
      min_bbox_px: 0               # smaller bbox side -> no evidence (prior); 0 = all instances
      stereo_max_dy_px: 1.5
      stereo_refresh: 8            # background depth propagated by the ego-motion, re-measured every N frames
      stereo_inst_points: 10       # stereo-matched points per instance (instance depth = their median)
      ego_iters: 4
      sigma_px_min: 0.25           # background residual std floor [px]
      sigma_sys_px: 0.25           # non-averaging instance residual floor [px]
      sigma_d_px: 0.5              # per-point disparity std (parallax term)
      gyro_sigma_rad: 0.002        # prior std of the per-frame gyro rotation correction (bias, time offset)
      no_imu_sigma_rad: 0.05       # gyro gap: rotation from the background points with this prior (<= 0: no evidence)
      max_ego_speed_mps: 1.5
      imu_time_offset_s: 0.0       # t_imu = t_cam + offset
      depth_rel_sigma: 0.5         # instantaneous GLS test: relative depth uncertainty along the epipolar line
      window_min_s: 0.4            # windowed test: anchor (mask centroid x median depth) vs chained ego-motion
      window_max_s: 0.8
      anchor_sigma_px: 4.0         # centroid jitter/drift [px] (heavy tails on real data: inflated)
      anchor_sigma_d_px: 0.6       # median disparity jitter/drift [rect px]
      window_moving_potential: false  # windowed test flags only always-dynamic instances as moving
      window_unveto_potential: false  # P6: windowed "moving" cancels a potential object's static veto (no root; promotable)
      q_move: 4.0                  # moving obs: |v| >= max(v_move, q_move*sigma) (instantaneous: Mahalanobis >= q_move)
      q_static: 3.0                # static obs: instantaneous Mahalanobis < q_static and windowed bounds below
      v_move_mps: 0.30
      v_move_radial_mps: 0.60
      v_static_mps: 0.30           # windowed |v_lat| + 2 sigma < v_static (and radial analogue)
      v_static_radial_mps: 0.60
      radial_static_required: true
      l_up: 1.5                    # log-odds per moving obs
      l_down: 0.25                 # log-odds per static obs (asymmetric: quick to mask, slow to unmask)
      l_max: 3.0
      prior_dynamic: 1.0
      prior_potential: -1.0
      th_moving: 1.5               # hysteresis: moving on at l >= 1.5, off at l <= 0
      th_static: -1.5              # static on at l <= -1.5, off at l >= 0
      max_missing: 5
      dup_overlap: 0.7             # duplicate detections (mask overlap / smaller mask >= this): younger track uses the older decision
      still_policy: unmask         # static person: unmask | band (192 only, relaxable)
      use_still: true              # (i) static always-dynamic instances are not masked / not roots
      promote_moving: true         # (ii) moving potential objects become roots
      veto_static: true            # (iii) static potential objects are never promoted
      static_mask_file: ""         # OpenVINS static mask png (background points avoid it)
      window_long_s: 0.0           # P7: > 0: also a long windowed test over [0.75, 1] x this (selective policy only; radial
                                   # noise ~ 1/window: static confirmation of large / near objects); <= 0 = off
    # ---------------------------------------------------------------- composition
    compose:
      right_mask: true
      right_close_px: 0
      right_fallback: none         # P4: instance without stereo depth -> none (no right polygon, P2) | median (frame median
                                   # disparity of instances with depth, else fb/right_fallback_depth_m) | band (same, as 192)
      right_fallback_depth_m: 3.0
      movable_static_value: 0      # SAVIOR-SG: value for movable-class objects currently classified static (kept, e.g.
                                   # unpromoted boxes, still people): 0 = off (masks stay 0/192/255), 1..127 (64 = semantic
                                   # chi2 gate of the OpenVINS fork, savior_semantic_gate); below every rejection threshold
    # ---------------------------------------------------------------- selective policy (P7, core/selective.py)
    # "conservative by default, selective when confident" for potential objects; enable=false = P2-P6 behaviour
    selective:
      enable: false
      prior_static_classes: "box,pallet"  # unknown state + no active root in contact -> unmasked (only move when carried);
                                   # every other potential class is masked until confirmed static
      confirm_s: 1.0               # confirmed static = unbroken static run >= confirm_s ...
      confirm_min_obs: 8           # ... with >= this many static observations ...
      stale_s: 0.5                 # ... the newest at most this old (provisional: expires when no longer re-confirmed)
      revoke_q: 3.0                # revoking obs (instantaneous / short / long window): |v| >= max(v_revoke, q*sigma)
      revoke_v_mps: 0.25
      revoke_v_radial_mps: 0.40
      revoke_hold_s: 1.0           # no static confirmation this long after a revocation
      long_static: true            # long-window static bound counts as static observation (motion.window_long_s > 0)
      converge_s: 5.0              # VIO convergence proxy: this long after motion onset; before, confirmations neither veto
                                   # links nor unmask non-prior classes (objects starting with the platform stay masked)
      onset_speed_mps: 0.2         # motion onset: perception ego speed > this ...
      onset_frames: 3              # ... for this many consecutive frames
      min_on_s: 0.5                # hysteresis: masked potential tracks stay masked (held) this long (off-delay)
      history_s: 2.0               # history-static (unmasks an unlinked object, never vetoes a link): evidence history >=
      history_max_revoke: 0.3      # history_s with an EMA revocation rate (time constant history_tau_s) below this
      history_tau_s: 1.0           # (radial motion is unobservable beyond ~5 m: far parked objects never "confirm")
      comotion_gate: true          # link from a moving parent refused if the child's windowed velocity is ~0 but differs
      comotion_q: 3.0              # from the parent's by >= comotion_q sigma (static stack vs carried load / driver)
      comotion_v_min_mps: 0.3      # parent windowed speed needed to apply the co-motion test
      unknown_promotes: false      # uncertain (masked, unknown-state) objects also promote their contacts
